# yaml-language-server: $schema=./run_schema.json
random_seed: 42

# feature_ravelli_aaa_v? - rcldch
# feature_ravelli_plushog_v3 - rcldch + hog
# feature_ravelli_cdch_v? - cdch
# feature_ravelli_rdch_v? - rdch
# ?? - ldch alone (row)
# feature_ravelli_all_v? - ldch, cdch, lbp, hog

# Try to remove drusen

paths:
  normalized_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/"
  original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli/train_preprocessed"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/OCTDL"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/train"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/C8/train/"
  cache: "cache"
  model_output: "models"

dataset:
  classes: ["NORMAL", "CNV", "DRUSEN", "DME"]
  # classes:
  #   NORMAL: "IDK"
  #   CNV: "CNV"
  #   DRUSEN: "IDK"
  #   DME: "DME"
  # classes: ["NORMAL", "DRUSEN"]
  # classes: [ "NORMAL", "CNV", "DRUSEN", "DME", "AMD", "CSR", "DR", "MH" ]
  # classes: ["NO", "AMD", "DME", "ERM", "RAO", "RVO", "VID"]
  # classes: ["NO", "AMD", "VID", "ERM"]
  samples_per_class: 3000
  sampling_proportions:
    train: 80
    val: 10
    test: 10

preprocessing_pipeline:
  - cropper:
      top: 8
      bottom: 8
      left: 8
      right: 8
  - corner_artifact_remover:
      min_threshold: 217
  - dwt_denoiser:
      method: "VisuShrink"
      wavelet: "sym2"
      mode: "soft"
      wavelet_levels: 1
      rescale_sigma: false

  - rpe_roi_aligner:
      roi_above: 137
      roi_below: 51
      blur_sigma: 6
      max_jump: 10
      poly_degree: 6

  # - clahe_filter:
  #     clip_limit: 10
  #     tile_grid_size: [8, 8]
  - resizer:
      target_size: [256, 120]

feature_extractor:
  - cdch:
      angle_step: 5
      center: [0.44, 0.55]
      pixel_range: [30, 222]
      bins: 256

dimensionality_reduction:
  active: "pca"
  params:
    n_components: 87
    whiten: false
    svd_solver: "randomized"
    random_state: 42
    iterated_power: 3
    power_iteration_normalizer: "LU"

classifier:
  active: "svm"
  params:
    kernel: "rbf"
    C: 1.9179538838424386
    gamma: 2.3558479236930363e-05
    class_weight: "balanced"
    probability: true
    shrinking: false
    n_jobs: 1
    degree: 5

  # active: "random_forest"
  # params:
  #   n_estimators: 300
  #   max_depth: 15
  #   min_samples_split: 5
  #   min_samples_leaf: 2
  #   max_features: "sqrt"
  #   class_weight: "balanced"
  #   n_jobs: -1
