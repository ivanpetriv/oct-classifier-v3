# yaml-language-server: $schema=./run_schema.json
random_seed: 42

paths:
  normalized_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/"
  original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli/train_preprocessed"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/OCTDL"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/train"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/C8/train/"
  cache: "cache"
  model_output: "models"

dataset:
  classes: [ "NORMAL", "CNV", "DRUSEN", "DME" ]
  samples_per_class: 3000
  sampling_proportions:
    train: 80
    val: 10
    test: 10

preprocessing_pipeline:
  - cropper:
      top: 8
      bottom: 8
      left: 8
      right: 8
  - corner_artifact_remover:
      min_threshold: 217
  - dwt_denoiser:
      method: "VisuShrink"
      wavelet: "sym2"
      mode: "soft"
      wavelet_levels: 1
      rescale_sigma: false

  - rpe_roi_aligner:
      roi_above: 137
      roi_below: 51
      blur_sigma: 6
      max_jump: 10
      poly_degree: 6

  # - clahe_filter:
  #     clip_limit: 10
  #     tile_grid_size: [4, 4]
  - resizer:
      target_size: [256, 120]

feature_extractor:
  - ldch:
      sections: 256
      layout: "row"
      pixel_range: [ 0, 255 ]
      bins: 256
  - ldch:
      sections: 256
      layout: "col"
      pixel_range: [ 0, 255 ]
      bins: 256

dimensionality_reduction:
  active: "pca"
  params:
    n_components: 442
    whiten: false
    svd_solver: "randomized"
    random_state: 42
    iterated_power: 2
    power_iteration_normalizer: "LU"


classifier:
  active: "svm"
  params:
    kernel: "rbf"   
    C: 4.719914039145424
    gamma: 9.039022850696851e-05
    class_weight: "balanced"
    probability: true
    shrinking: true
    n_jobs: -1
    degree: 5
