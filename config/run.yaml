# yaml-language-server: $schema=./run_schema.json
random_seed: 42

paths:
  normalized_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/"
  original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli/train"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/OCTDL"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/train"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/C8/train/"
  cache: "cache"
  model_output: "models"

dataset:
  classes: [ "NORMAL", "CNV", "DRUSEN", "DME" ]
  # classes: [ "NORMAL", "CNV", "DRUSEN", "DME", "AMD", "CSR", "DR", "MH" ]
  # classes: ["NO", "AMD", "DME", "ERM", "RAO", "RVO", "VID"]
  # classes: ["NO", "AMD", "DME", "ERM"]
  samples_per_class: 500
  sampling_proportions:
    train: 80
    val: 10
    test: 10

preprocessing_pipeline:
  - corner_artifact_remover:
      min_threshold: 230
  - rpe_aligner: {}
  # - rpe_roi_aligner:
  #     roi_above: 80
  #     roi_below: 40
  #     blur_sigma: 3
  #     max_jump: 5
  - dwt_denoiser:
      wavelet: "coif3"
      mode: "hard"
      wavelet_levels: 3
  # - clahe_filter:
  #     clip_limit: 10
  #     tile_grid_size: [8, 8]
  - resizer:
      target_size: [256, 256]

feature_extractor:
  - rcldch:
      sections: 64
      pixel_range: [ 29, 234 ]
      bins: 192
  # active: "ldch"
  # params:
  #   sections: 32
  #   layout: "row"
  #   pixel_range: [ 0, 210 ]
  #   bins: 192
  # - lbp:
  #     n_points: 8             # Number of circularly symmetric neighbor set points
  #     radius: 1               # Radius of circle
  #     method: "uniform"       # Standard method for rotational invariance
  #     norm: "l2"
  #     padding_threshold: 0
  # - hog:
  #     orientations: 20         # Standard number of gradient direction bins
  #     pixels_per_cell: [12, 12]      # Evaluates an 8x8 pixel block
  #     cells_per_block: [2, 2]      # Normalizes across a 2x2 block of cells
  #     block_norm: "L2-Hys"

dimensionality_reduction:
  active: "pca"
  params:
    n_components: 104
    whiten: true
    svd_solver: "randomized"
    random_state: 42


classifier:
  active: "svm"
  params:
    kernel: "rbf"   
    C: 13.5
    gamma: 0.0043
    class_weight: "balanced"
    probability: true
    shrinking: true
    n_jobs: -1

  # active: "random_forest"
  # params:
  #   n_estimators: 300
  #   max_depth: 15
  #   min_samples_split: 5
  #   min_samples_leaf: 2
  #   max_features: "sqrt"
  #   class_weight: "balanced"
  #   n_jobs: -1
