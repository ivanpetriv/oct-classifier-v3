# yaml-language-server: $schema=./run_schema.json
random_seed: 42

paths:
  normalized_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/T\
    hesis/Ravelli-normalized/"
  original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli"
  cache: "cache"
  model_output: "models"

dataset:
  classes: [ "NORMAL", "CNV", "DRUSEN", "DME" ]
  samples_per_class: 1000
  sampling_proportions:
    train: 80
    val: 10
    test: 10

preprocessing_pipeline:
  - corner_artifact_remover:
      min_threshold: 250
  - dwt_denoiser:
      wavelet: "coif3"
      mode: "hard"
      wavelet_levels: 3
  - rpe_aligner: {}

feature_extractor:
  active: "rcldch"
  params:
    sections: 32
    pixel_range: [ 24, 241 ]
    bins: 256

dimensionality_reduction:
  active: "pca"
  params:
    n_components: 200
    whiten: True

classifier:
  active: "svm"
  params:
    kernel: "rbf"
    C: 82.96749960979622
    gamma: "scale"
