# yaml-language-server: $schema=./run_schema.json
random_seed: 42

paths:
  normalized_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli/"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/OCTDL"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/train/"
  original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/C8/train/"
  cache: "cache"
  model_output: "models"

dataset:
  classes: [ "NORMAL", "CNV", "DRUSEN", "DME" ]
  # classes: [ "NORMAL", "CNV", "DRUSEN", "DME", "AMD", "CSR", "DR", "MH" ]
  # classes: ["NO", "AMD", "DME", "ERM", "RAO", "RVO", "VID"]
  # classes: ["NO", "AMD", "DME", "ERM"]
  samples_per_class: 500
  sampling_proportions:
    train: 80
    val: 10
    test: 10

preprocessing_pipeline:
  - corner_artifact_remover:
      min_threshold: 250
  - rpe_aligner: {}
  - dwt_denoiser:
      wavelet: "coif3"
      mode: "hard"
      wavelet_levels: 3
  - clahe_filter:
      clip_limit: 10
      tile_grid_size: [8, 8]
  - resizer:
      target_size: [256, 256]

feature_extractor:
  active: "rcldch"
  params:
    sections: 128
    pixel_range: [ 12, 254 ]
    bins: 128
  # active: "ldch"
  # params:
  #   sections: 128
  #   layout: "row"
  #   pixel_range: [ 12, 254 ]
  #   bins: 128
  # active: "lbp"
  # params:
  #   n_points: 8             # Number of circularly symmetric neighbor set points
  #   radius: 1               # Radius of circle
  #   method: "uniform"       # Standard method for rotational invariance
  #   norm: "l2"
  #   padding_threshold: 0
  # active: "hog"
  # params:
  #   orientations: 9         # Standard number of gradient direction bins
  #   pixels_per_cell: [32, 32]      # Evaluates an 8x8 pixel block
  #   cells_per_block: [2, 2]      # Normalizes across a 2x2 block of cells

dimensionality_reduction:
  active: "pca"
  params:
    n_components: 256
    whiten: True
    svd_solver: "auto"

classifier:
  active: "svm"
  params:
    kernel: "rbf"
    C: 1
    gamma: "scale"
    probability: false
    shrinking: true
    class_weight: "balanced"
    n_jobs: -1
