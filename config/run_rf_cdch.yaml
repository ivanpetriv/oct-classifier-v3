# yaml-language-server: $schema=./run_schema.json
random_seed: 42

paths:
  normalized_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/"
  original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli/train_preprocessed"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/OCTDL"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/Ravelli-normalized-v2/train"
  # original_dataset: "/run/media/ivan/01DCA2451BEF4120/LPNU/University/masters/Thesis/C8/train/"
  cache: "cache"
  model_output: "models"

dataset:
  classes: ["NORMAL", "CNV", "DRUSEN", "DME"]
  samples_per_class: 3000
  sampling_proportions:
    train: 80
    val: 10
    test: 10

preprocessing_pipeline:
  - cropper:
      top: 8
      bottom: 8
      left: 8
      right: 8
  - corner_artifact_remover:
      min_threshold: 217
  - dwt_denoiser:
      method: "VisuShrink"
      wavelet: "sym2"
      mode: "soft"
      wavelet_levels: 1
      rescale_sigma: false

  - rpe_roi_aligner:
      roi_above: 137
      roi_below: 51
      blur_sigma: 6
      max_jump: 10
      poly_degree: 6

  # - clahe_filter:
  #     clip_limit: 10
  #     tile_grid_size: [8, 8]
  - resizer:
      target_size: [256, 120]

feature_extractor:

  - cdch:
      angle_step: 5
      center: [0.4934265977665214, 0.5521780411467775]
      pixel_range: [26, 230]
      bins: 96
 
dimensionality_reduction:
  active: "pca"
  params:
    n_components: 59
    whiten: false
    svd_solver: "randomized"
    random_state: 42
    iterated_power: 6
    power_iteration_normalizer: "QR"

classifier:
  active: "random_forest"
  params:
    bootstrap: true
    criterion: "entropy"
    n_estimators: 500
    max_depth: 43
    max_samples: 0.9993905490797066
    min_samples_split: 4
    min_samples_leaf: 2
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1
